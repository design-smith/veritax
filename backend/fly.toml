# Fly.io app config. Official: https://fly.io/docs/reference/configuration/
# Deploy from this directory so the Dockerfile context is backend/:
#   fly launch --no-deploy
#   fly secrets set …
#   fly deploy
# https://fly.io/docs/languages-and-frameworks/dockerfile/

app = "veritax-api"
primary_region = "iad"
kill_timeout = 300

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  S3_BUCKET = "veritax-sources"
  S3_REGION = "auto"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [http_service.http_options]
    idle_timeout = 600

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
